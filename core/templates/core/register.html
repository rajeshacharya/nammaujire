{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 600px; margin-top: 4rem;">
    <div class="glass-card animate-fade-in-up">
        <h2 class="text-center mb-6" style="color: var(--primary);">Join Namma Ujire</h2>
        
        <div class="flex justify-center gap-4 mb-6">
            <a href="?role=customer" class="btn {% if role == 'customer' %}btn-primary{% else %}btn-outline{% endif %}">I'm a Customer</a>
            <a href="?role=provider" class="btn {% if role == 'provider' %}btn-primary{% else %}btn-outline{% endif %}">I'm a Service Provider</a>
        </div>

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="role_type" value="{{ role }}">
            
            <div class="grid grid-cols-2">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            {% if role == 'provider' %}
            <hr style="margin: 2rem 0; border-color: var(--card-border);">
            <h4 class="mb-4 text-secondary">Service Details</h4>
            
            <div class="form-group">
                <label class="form-label">Full Name / Business Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            
            <div class="grid grid-cols-2">
                <div class="form-group">
                    <label class="form-label">Service Type</label>
                    <select name="service_type" class="form-control" required>
                        {% for value, label in service_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone" class="form-control" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Location in Ujire</label>
                <input type="text" name="location" class="form-control" required placeholder="e.g. Near Bus Stand">
            </div>
            {% endif %}
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account <i class="fa-solid fa-user-plus"></i></button>
        </form>
        
        <div class="text-center mt-6 text-muted">
            Already have an account? <a href="{% url 'login' %}" style="font-weight: 600;">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
