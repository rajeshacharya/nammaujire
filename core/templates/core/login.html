{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 500px; margin-top: 4rem;">
    <div class="glass-card animate-fade-in-up">
        <h2 class="text-center mb-6" style="color: var(--primary);">Welcome Back</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required placeholder="Enter your password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
        </form>
        
        <div class="text-center mt-6 text-muted">
            Don't have an account? <a href="{% url 'register' %}" style="font-weight: 600;">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
