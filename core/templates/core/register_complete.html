{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 600px; margin-top: 4rem;">
    <div class="glass-card animate-fade-in-up">
        <h2 class="text-center mb-6" style="color: var(--primary);">Complete Your Profile</h2>
        <p class="text-center text-muted mb-4">Phone number verified (+91 {{ phone }}). Just a few details before you get started!</p>
        
        <div class="flex justify-center gap-4 mb-6">
            <a href="?role=customer" class="btn {% if role == 'customer' %}btn-primary{% else %}btn-outline{% endif %}">I'm a Customer</a>
            <a href="?role=provider" class="btn {% if role == 'provider' %}btn-primary{% else %}btn-outline{% endif %}">I'm a Service Provider</a>
        </div>

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="role_type" value="{{ role }}">
            
            <div class="form-group">
                <label class="form-label">Full Name {% if role == 'provider' %}/ Business Name{% endif %}</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email (Optional)</label>
                <input type="email" name="email" class="form-control">
            </div>

            {% if role == 'provider' %}
            <hr style="margin: 2rem 0; border-color: var(--card-border);">
            <h4 class="mb-4 text-secondary">Service Details</h4>
            
            <div class="grid grid-cols-2">
                <div class="form-group">
                    <label class="form-label">Service Type</label>
                    <select name="service_type" class="form-control" required>
                        {% for value, label in service_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Location in Ujire</label>
                    <input type="text" name="location" class="form-control" required placeholder="e.g. Near Bus Stand">
                </div>
            </div>
            {% endif %}
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Complete Profile & Dashboard <i class="fa-solid fa-arrow-right"></i></button>
        </form>
    </div>
</div>
{% endblock %}
